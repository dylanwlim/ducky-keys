name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test mapping lifecycle
        run: swift test
      - name: Build universal app
        run: ./scripts/build.sh universal
      - name: Validate bundle
        run: |
          codesign --verify --strict 'dist/Ducky Keys.app'
          python3 -c "import subprocess; assert set(subprocess.check_output(['lipo', '-archs', 'dist/Ducky Keys.app/Contents/MacOS/DuckyKeys'], text=True).split()) == {'arm64', 'x86_64'}"
          plutil -lint 'dist/Ducky Keys.app/Contents/Info.plist'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ducky-Keys
          path: |
            dist/Ducky-Keys.zip
            dist/SHA256SUMS.txt
